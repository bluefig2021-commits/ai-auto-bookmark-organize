<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디지털 쓰레기 분리수거장</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f5; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .api-key-section { margin-bottom: 30px; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
    input[type="password"] { padding: 10px; width: 60%; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; background: #1e293b; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #334155; }
    .btn-action { width: 100%; margin-bottom: 10px; background: #0f172a; padding: 15px; }
    .archive-header { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    details { margin-bottom: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
    summary { font-weight: 700; cursor: pointer; font-size: 1.1rem; list-style-type: none; outline: none; }
    summary::-webkit-details-marker { display: none; }
    .sub-cat { margin-left: 20px; margin-top: 10px; background: #fff; border: 1px solid #f1f5f9; }
    .sub-cat summary { font-size: 1rem; font-weight: 600; color: #475569; }
    ul { margin-top: 10px; padding-left: 25px; }
    li { margin-bottom: 8px; color: #64748b; }
    a { text-decoration: none; color: #2563eb; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <h2>디지털 쓰레기 분리수거장</h2>
    <p style="color: #64748b; margin-bottom: 30px;">방치된 북마크 무덤을 AI가 자동 분류하고 팩폭으로 심판하는 공간.</p>

    <!-- API 키 설정 구역 -->
    <div class="api-key-section">
      <h3 style="margin-top: 0; font-size: 1rem; color: #334155;">Gemini API 키 설정 (필수)</h3>
      <input type="password" id="gemini-api-key" placeholder="API Key 입력 (로컬에만 저장됨)">
      <button id="save-key-btn">키 저장</button>
      <p id="key-status" style="font-size: 0.85rem; color: #ef4444; margin-top: 8px;">* API 키가 없습니다. 먼저 등록하세요.</p>
    </div>

    <!-- 액션 버튼 구역 -->
    <div style="margin-bottom: 30px;">
      <button class="btn-action" id="start-sort-btn">이미 저장된 미분류 북마크 AI 분류 시작</button>
    </div>

    <!-- 렌더링 구역 -->
    <div class="archive-header">
      <h3 style="margin: 0;">ARCHIVE</h3>
    </div>
    <div id="bookmark-archive-container" style="margin-top: 20px;">
      <p style="color: #94a3b8; text-align: center; padding: 20px;">아직 분류된 북마크가 없습니다.</p>
    </div>
  </div>

  <script>
    // 1. API 키 로컬 스토리지 관리
    const apiKeyInput = document.getElementById('gemini-api-key');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const keyStatus = document.getElementById('key-status');

    function checkApiKey() {
      const savedKey = localStorage.getItem('geminiApiKey');
      if (savedKey) {
        apiKeyInput.value = savedKey;
        keyStatus.textContent = "✅ API 키가 로컬 스토리지에 안전하게 고정되었습니다.";
        keyStatus.style.color = "#10b981";
      }
    }
    checkApiKey();

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) return alert('키를 입력해라.');
      localStorage.setItem('geminiApiKey', key);
      checkApiKey();
      alert('API 키 로컬 저장 완료.');
    });

    // 2. 미분류 북마크 AI 분류 및 청크(Chunk) 처리 로직
    const startSortBtn = document.getElementById('start-sort-btn');
    const container = document.getElementById('bookmark-archive-container');

    startSortBtn.addEventListener('click', async () => {
      const apiKey = localStorage.getItem('geminiApiKey');
      if (!apiKey) {
        alert('API 키부터 저장해라. 안 그러면 AI 못 돌린다.');
        return;
      }

      // 테스트용 가짜 미분류 북마크 데이터 (실제 파이어베이스 DB 데이터로 교체해야 함)
      const mockBookmarks = [
        { title: "React 공식 문서", url: "https://react.dev" },
        { title: "무신사 스탠다드 와이드 슬랙스", url: "https://musinsa.com" },
        { title: "Next.js 튜토리얼", url: "https://nextjs.org" },
        { title: "오늘의집 USM 모듈 가구", url: "https://ohou.se" }
      ];

      startSortBtn.textContent = "AI 분류 진행 중... (브라우저 끄지 마라)";
      startSortBtn.disabled = true;

      const chunkSize = 20;
      let classifiedResults = [];

      for (let i = 0; i < mockBookmarks.length; i += chunkSize) {
        const chunk = mockBookmarks.slice(i, i + chunkSize);
        
        const promptText = `
        너는 웹 북마크 자동 분류기야. 다음 북마크 리스트를 분석해서 가장 직관적인 대분류(mainCategory)와 소분류(subCategory)를 도출해.
        반드시 아래 JSON 배열 형식으로만 응답하고, 마크다운 기호나 부가 설명은 절대 덧붙이지 마.
        예시: [{"title": "북마크 제목", "url": "주소", "mainCategory": "IT", "subCategory": "프론트엔드"}]
        
        분류할 데이터: ${JSON.stringify(chunk)}
        `;

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }],
              generationConfig: { response_mime_type: "application/json" } 
            })
          });
          
          const data = await response.json();
          const resultJson = JSON.parse(data.candidates[0].content.parts[0].text);
          classifiedResults = classifiedResults.concat(resultJson);
          
        } catch (error) {
          console.error('API 호출 에러:', error);
          alert('API 호출 중에 에러 났다. 콘솔 확인해라.');
          break; 
        }
      }
      
      // 분류 완료 후 렌더링
      renderAccordion(classifiedResults);
      startSortBtn.textContent = "이미 저장된 미분류 북마크 AI 분류 시작";
      startSortBtn.disabled = false;
    });

    // 3. 아코디언 트리 구조 렌더링 로직
    function renderAccordion(classifiedData) {
      if (classifiedData.length === 0) return;
      container.innerHTML = ''; 

      // 대분류 > 소분류 그룹화
      const grouped = classifiedData.reduce((acc, item) => {
        if (!acc[item.mainCategory]) acc[item.mainCategory] = {};
        if (!acc[item.mainCategory][item.subCategory]) acc[item.mainCategory][item.subCategory] = [];
        acc[item.mainCategory][item.subCategory].push(item);
        return acc;
      }, {});

      // HTML 트리 조립
      for (const [mainCat, subCats] of Object.entries(grouped)) {
        let mainDetails = `<details open>
                             <summary>📁 ${mainCat}</summary>`;
        
        for (const [subCat, items] of Object.entries(subCats)) {
          let subDetails = `<details class="sub-cat">
                              <summary>📂 ${subCat} <span>(${items.length})</span></summary>
                              <ul>`;
          
          items.forEach(item => {
            subDetails += `<li><a href="${item.url}" target="_blank">${item.title}</a></li>`;
          });
          
          subDetails += `</ul></details>`;
          mainDetails += subDetails;
        }
        mainDetails += `</details>`;
        container.innerHTML += mainDetails;
      }
    }
  </script>
</body>
</html>
