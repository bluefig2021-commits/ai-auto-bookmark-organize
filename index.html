<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>디지털 쓰레기 분리수거장</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-color: #f7f7f5;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #777777;
            --accent: #111111;
            --danger: #c92a2a;
            --border: #e5e5df;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 60px 20px; 
            line-height: 1.6;
        }

        h1, h2, h3 { 
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            text-align: center;
        }
        .google-btn {
            background: #ffffff;
            color: #333333;
            border: 1px solid var(--border);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .google-btn:hover { background: #f5f5f5; }

        .box { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); 
        }

        input, button:not(.google-btn) { 
            width: 100%; 
            padding: 12px 16px; 
            margin-top: 10px; 
            background: #fafafa; 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            background: #ffffff;
        }
        button:not(.google-btn) { 
            background: var(--accent); 
            color: #ffffff; 
            font-weight: 500; 
            cursor: pointer; 
            border: none; 
        }
        button:not(.google-btn):hover { opacity: 0.85; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
        }
        th, td { 
            padding: 14px; 
            text-align: left; 
            font-size: 14px; 
            border-bottom: 1px solid var(--border);
        }
        th { 
            font-weight: 600; 
            color: var(--text-sub);
            background: #fafafa;
        }
        a { color: var(--text-main); text-decoration: underline; text-underline-offset: 4px; }
        a:hover { color: var(--danger); }

        .result-card {
            background: #fafafa;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
            white-space: pre-wrap;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1단계: 구글 로그인 오버레이 -->
    <div id="googleLoginOverlay" class="overlay">
        <div class="login-box">
            <h2>GOOGLE AUTH</h2>
            <p style="color: var(--text-sub); font-size: 13px; margin-top: 8px;">1차 구글 계정 인증을 진행한다.</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.96c1.73-1.59 2.73-3.93 2.73-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.26c-.82.55-1.87.88-3 .88-2.31 0-4.27-1.56-4.97-3.66H1.01v2.33C2.53 15.96 5.53 18 9 18z"/><path fill="#FBBC05" d="M4.03 10.78c-.18-.55-.28-1.13-.28-1.78s.1-1.23.28-1.78V4.89H1.01C.37 6.17 0 7.62 0 9.17s.37 3 .01 4.28l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.53 0 2.53 2.04 1.01 4.89l3.02 2.33c.7-2.1 2.66-3.64 4.97-3.64z"/></svg>
                Google 계정으로 로그인
            </button>
        </div>
    </div>

    <!-- 2단계: 관계자 외 출입금지 비밀번호 오버레이 -->
    <div id="passwordOverlay" class="overlay hidden">
        <div class="login-box">
            <h2>RESTRICTED AREA</h2>
            <p style="color: var(--text-sub); font-size: 13px; margin-top: 8px;">관계자 외 출입 금지다. 비밀번호를 입력해라.</p>
            <input type="password" id="passInput" placeholder="관계자 비밀번호 입력">
            <button onclick="verifyPassword()" style="margin-top: 15px;">진입하기</button>
        </div>
    </div>

    <!-- 메인 컨텐츠 -->
    <div id="mainContent" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
            <div>
                <h1 style="margin: 0; font-size: 24px;">디지털 쓰레기 분리수거장</h1>
                <p style="margin: 5px 0 0 0; color: var(--text-sub); font-size: 14px;">방치된 북마크 무덤을 AI가 자동 분류하고 팩폭으로 심판하는 공간.</p>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="userEmail" style="font-size: 13px; color: var(--text-sub);"></span>
                <button onclick="logout()" style="width: auto; padding: 8px 14px; background: transparent; color: var(--text-sub); border: 1px solid var(--border);">로그아웃</button>
            </div>
        </div>

        <div class="box">
            <h3 style="margin-top: 0;">SYSTEM CONFIG</h3>
            <label style="font-size: 13px; color: var(--text-sub);">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AI Studio API Key 입력">
        </div>

        <div class="box">
            <h3 style="margin-top: 0;">BOOKMARK UPLOAD & AI SORTING</h3>
            <p style="font-size: 13px; color: var(--text-sub);">북마크 파일을 올리면 AI가 카테고리별로 자동 분류하고 정돈한다.</p>
            <input type="file" id="fileInput" accept=".html,.csv" style="background: transparent; border: none; padding: 0;">
            <button onclick="handleFileUpload()" style="margin-top: 15px;">북마크 밀어넣기 & AI 분류 시작</button>
            <div id="aiSortResult"></div>
        </div>

        <div class="box">
            <h3 style="margin-top: 0;">DAILY ARTIFACT</h3>
            <p style="font-size: 13px; color: var(--text-sub);">무작위로 유물을 하나 끄집어내어 AI 검열관의 심판을 받는다.</p>
            <button onclick="pickRandomBookmark()">유물 발굴하기</button>
            <div id="resultArea"></div>
        </div>

        <div class="box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">ARCHIVE (<span id="count">0</span>)</h3>
                <button onclick="clearBookmarks()" style="width: auto; padding: 6px 12px; background: transparent; color: var(--danger); border: 1px solid var(--danger);">전체 초기화</button>
            </div>
            <div style="max-height: 400px; overflow-y: auto; margin-top: 15px;">
                <table id="bookmarkTable">
                    <thead>
                        <tr><th>TITLE</th><th>LINK</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- 설정 영역 ---
        const MY_PASS = "너가원하는비밀번호"; // 여기에 관계자 비밀번호 설정

        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 로그인 상태 감지
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('googleLoginOverlay').classList.add('hidden');
                // 구글 로그인 성공 후, 비밀번호 검증 단계를 거쳤는지 확인
                if (sessionStorage.getItem('pass_verified') === 'true') {
                    showMainApp(user.email);
                } else {
                    document.getElementById('passwordOverlay').classList.remove('hidden');
                }
            } else {
                document.getElementById('googleLoginOverlay').classList.remove('hidden');
                document.getElementById('passwordOverlay').classList.add('hidden');
                document.getElementById('mainContent').classList.add('hidden');
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch((error) => {
                alert('구글 로그인 실패: ' + error.message);
            });
        }

        function verifyPassword() {
            const input = document.getElementById('passInput').value.trim();
            if (input === MY_PASS) {
                sessionStorage.setItem('pass_verified', 'true');
                document.getElementById('passwordOverlay').classList.add('hidden');
                const user = auth.currentUser;
                if (user) showMainApp(user.email);
            } else {
                alert('비밀번호 틀렸다. 나가라.');
            }
        }

        function showMainApp(email) {
            document.getElementById('passwordOverlay').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('userEmail').textContent = email;
            loadApiKey();
        }

        function logout() {
            sessionStorage.removeItem('pass_verified');
            auth.signOut();
        }

        let bookmarks = JSON.parse(localStorage.getItem('my_bookmarks') || '[]');
        updateTable();

        document.getElementById('apiKey').addEventListener('input', (e) => {
            localStorage.setItem('gemini_api_key', e.target.value);
        });

        function loadApiKey() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert('파일을 선택해라.');
                return;
            }
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('AI 자동 분류를 하려면 제미나이 API 키를 먼저 입력해라.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.readAsText(file);
            reader.onload = async function(e) {
                const content = e.target.result;
                let newItems = [];

                if (file.name.endsWith('.html')) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(content, 'text/html');
                    doc.querySelectorAll('a').forEach(a => {
                        const href = a.getAttribute('href');
                        const title = a.textContent;
                        if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
                            newItems.push({ title: title.trim(), url: href });
                        }
                    });
                } else if (file.name.endsWith('.csv')) {
                    content.split('\n').forEach(line => {
                        const parts = line.split(',');
                        if (parts.length >= 2 && parts[0].trim().startsWith('http')) {
                            newItems.push({ title: parts[1].trim(), url: parts[0].trim() });
                        }
                    });
                }

                const existingUrls = new Set(bookmarks.map(b => b.url));
                const uniqueNewItems = newItems.filter(item => !existingUrls.has(item.url));

                bookmarks = bookmarks.concat(uniqueNewItems);
                localStorage.setItem('my_bookmarks', JSON.stringify(bookmarks));
                updateTable();

                const sortResultDiv = document.getElementById('aiSortResult');
                sortResultDiv.innerHTML = `<div class="result-card"><span style="color:var(--text-sub)">총 ${uniqueNewItems.length}개의 북마크를 AI가 분석하고 분류하는 중이다...</span></div>`;

                const titlesSnippet = uniqueNewItems.slice(0, 15).map(b => `- ${b.title}`).join('\n');
                const prompt = `다음 북마크 제목들을 보고, 성격에 맞게 카테고리별로 자동 분류해 주고, 전반적인 취향에 대해 시니컬하게 반말 팩폭을 날려줘.\n\n${titlesSnippet}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await response.json();
                    const aiText = data.candidates[0].content.parts[0].text;
                    sortResultDiv.innerHTML = `<div class="result-card"><b>AI 자동 분류 및 심판 결과:</b><br><br>${aiText}</div>`;
                } catch (err) {
                    sortResultDiv.innerHTML = `<div class="result-card" style="color:var(--danger);">AI 분석 통신 에러: ${err}</div>`;
                }

                fileInput.value = '';
            };
        }

        function updateTable() {
            const tbody = document.querySelector('#bookmarkTable tbody');
            tbody.innerHTML = '';
            document.getElementById('count').textContent = bookmarks.length;
            
            [...bookmarks].reverse().forEach(b => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${b.title}</td><td><a href="${b.url}" target="_blank">ACCESS</a></td>`;
                tbody.appendChild(tr);
            });
        }

        function clearBookmarks() {
            if (confirm('전체 데이터 폭파하겠냐?')) {
                bookmarks = [];
                localStorage.removeItem('my_bookmarks');
                updateTable();
                document.getElementById('resultArea').innerHTML = '';
                document.getElementById('aiSortResult').innerHTML = '';
            }
        }

        async function pickRandomBookmark() {
            if (bookmarks.length === 0) {
                alert('데이터가 없다. 북마크부터 올려라.');
                return;
            }
            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert('API 키를 먼저 입력해라.');
                return;
            }

            const picked = bookmarks[Math.floor(Math.random() * bookmarks.length)];
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = `<div class="result-card"><b>TARGET:</b> <a href="${picked.url}" target="_blank">${picked.title}</a><br><span style="color:var(--text-sub)">AI 검열관이 내용을 분석하는 중이다...</span></div>`;

            const prompt = `다음 북마크 내용을 분석해라. 
제목: ${picked.title}
URL: ${picked.url}

지시사항:
1. 이 링크가 어떤 내용인지 한국어로 핵심만 요약해라.
2. 만약 쓰레기 같은 낚시성 콘텐츠나 영양가 없는 영상이라면, 사용자가 왜 이런 걸 저장했는지 아주 시니컬하고 직설적으로 반말로 팩폭을 날려라.
3. 유용한 정보라면 칭찬과 함께 가치를 설명해라.

출력 형식:
[분석 요약]
...

[AI 검열관의 한마디]
...`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                resultArea.innerHTML = `<div class="result-card"><b>TARGET:</b> <a href="${picked.url}" target="_blank">${picked.title}</a><br><br>${aiText}</div>`;
            } catch (err) {
                resultArea.innerHTML = `<div class="result-card" style="color:var(--danger);">통신 에러 발생: ${err}</div>`;
            }
        }
    </script>
</body>
</html>
