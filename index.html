<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Archive</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f4f4f1;
  --paper: #fff;
  --text: #181818;
  --muted: #858585;
  --line: #deded9;
  --soft: #ecece7;
  --accent: #181818;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

/* =========================
   TOP
========================= */

.top {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(244,244,241,.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.top-inner {
  max-width: 1280px;
  margin: auto;
  padding: 18px 28px 0;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.brand {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -1px;
}

.brand small {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-left: 7px;
  letter-spacing: 0;
}

.actions {
  display: flex;
  gap: 7px;
}

.action {
  border: 1px solid var(--line);
  background: var(--paper);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  color: #333;
}

.action:hover {
  background: #e9e9e4;
}

.action.dark {
  background: #181818;
  border-color: #181818;
  color: white;
}

.action.dark:hover {
  background: #000;
}

/* =========================
   CATEGORY NAV
========================= */

.nav {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  padding-top: 20px;
  scrollbar-width: none;
}

.nav::-webkit-scrollbar {
  display: none;
}

.nav button {
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  color: #888;
  padding: 9px 12px 12px;
  border-bottom: 2px solid transparent;
  font-size: 12px;
  white-space: nowrap;
}

.nav button:hover {
  color: #222;
}

.nav button.active {
  color: #111;
  border-bottom-color: #111;
  font-weight: 700;
}

.nav .tool {
  color: #555;
}

.nav .tool:first-child {
  margin-left: 0;
}

/* =========================
   MAIN
========================= */

.main {
  max-width: 1280px;
  margin: auto;
  padding: 30px 28px 70px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 24px;
}

.heading {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -1px;
}

.count {
  font-size: 12px;
  color: var(--muted);
  margin-left: 8px;
}

.search {
  width: 270px;
  border: 1px solid var(--line);
  background: white;
  padding: 9px 11px;
  border-radius: 6px;
  outline: none;
  font-size: 12px;
}

.search:focus {
  border-color: #999;
}

/* =========================
   BOOKMARK LIST
========================= */

.list {
  display: flex;
  flex-direction: column;
  border-top: 1px solid #ccc;
}

.item {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 14px;
  padding: 15px 8px;
  border-bottom: 1px solid var(--line);
}

.item:hover {
  background: rgba(255,255,255,.45);
}

.favicon {
  width: 25px;
  height: 25px;
  object-fit: contain;
}

.item-main {
  min-width: 0;
}

.item-title {
  display: block;
  color: #171717;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-title:hover {
  text-decoration: underline;
}

.item-url {
  color: #999;
  font-size: 11px;
  margin-top: 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tag {
  color: #777;
  font-size: 11px;
  white-space: nowrap;
}

.edit-btn {
  border: 0;
  background: transparent;
  color: #aaa;
  font-size: 11px;
  padding: 6px;
}

.edit-btn:hover {
  color: #111;
}

/* =========================
   EMPTY
========================= */

.empty {
  border-top: 1px solid #ccc;
  padding: 70px 20px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

.empty strong {
  display: block;
  color: #333;
  margin-bottom: 8px;
}

/* =========================
   RANDOM
========================= */

.random-screen {
  display: none;
}

.random-screen.show {
  display: block;
}

.random-card {
  min-height: 55vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.random-inner {
  width: min(760px, 100%);
  text-align: center;
  padding: 50px 20px;
}

.random-number {
  color: #aaa;
  font-size: 11px;
  margin-bottom: 35px;
}

.random-favicon {
  width: 42px;
  height: 42px;
  object-fit: contain;
  margin-bottom: 24px;
}

.random-title {
  display: block;
  color: #111;
  text-decoration: none;
  font-size: clamp(25px, 5vw, 46px);
  font-weight: 800;
  line-height: 1.15;
  letter-spacing: -2px;
  word-break: keep-all;
}

.random-title:hover {
  text-decoration: underline;
}

.random-domain {
  margin-top: 17px;
  color: #999;
  font-size: 12px;
}

.random-category {
  margin-top: 8px;
  color: #777;
  font-size: 11px;
}

.random-next {
  margin-top: 45px;
  border: 1px solid #ccc;
  background: white;
  padding: 11px 18px;
  border-radius: 6px;
  font-size: 12px;
}

/* =========================
   MODAL
========================= */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.35);
  padding: 20px;
}

.overlay.show {
  display: flex;
}

.modal {
  width: min(650px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border: 1px solid #ddd;
  box-shadow: 0 20px 70px rgba(0,0,0,.2);
}

.modal-head {
  padding: 18px 20px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 15px;
  font-weight: 800;
}

.close {
  border: 0;
  background: transparent;
  font-size: 21px;
  color: #888;
}

.modal-body {
  padding: 20px;
}

.field {
  margin-bottom: 17px;
}

.field:last-child {
  margin-bottom: 0;
}

.label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: #555;
  margin-bottom: 7px;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid #ddd;
  background: #fafaf8;
  padding: 10px;
  outline: none;
  border-radius: 5px;
  font-size: 12px;
}

.field textarea {
  min-height: 210px;
  resize: vertical;
  font-family: monospace;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: #999;
  background: white;
}

.help {
  color: #999;
  font-size: 10px;
  line-height: 1.5;
  margin-top: 6px;
}

.modal-foot {
  border-top: 1px solid #eee;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.modal-right {
  display: flex;
  gap: 7px;
}

.danger {
  color: #b33;
  border-color: #ead0d0;
  background: #fff;
}

/* =========================
   PROGRESS
========================= */

.progress {
  display: none;
  margin-top: 15px;
}

.progress.show {
  display: block;
}

.progress-text {
  font-size: 11px;
  color: #777;
  margin-bottom: 7px;
}

.progress-bar {
  height: 4px;
  background: #eee;
}

.progress-fill {
  width: 0;
  height: 100%;
  background: #222;
  transition: width .2s;
}

/* =========================
   ERROR
========================= */

.error {
  display: none;
  margin-top: 15px;
  padding: 11px;
  background: #fff3f3;
  border: 1px solid #edd0d0;
  color: #a33;
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.error.show {
  display: block;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 720px) {

  .top-inner {
    padding: 15px 15px 0;
  }

  .brand-row {
    align-items: flex-start;
  }

  .brand small {
    display: none;
  }

  .actions {
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .main {
    padding: 22px 15px 50px;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .search {
    width: 100%;
  }

  .item {
    grid-template-columns: 28px minmax(0,1fr) auto;
  }

  .item .tag {
    display: none;
  }

  .random-title {
    font-size: 30px;
  }
}
</style>
</head>


<body>

<!-- =========================
     TOP
========================= -->

<header class="top">

  <div class="top-inner">

    <div class="brand-row">

      <div class="brand">
        DIGITAL ARCHIVE
        <small>personal collection</small>
      </div>

      <div class="actions">

        <button
          class="action"
          onclick="openHTMLImport()"
        >
          북마크 HTML
        </button>

        <button
          class="action"
          onclick="openJSON()"
        >
          JSON
        </button>

        <button
          class="action dark"
          onclick="openAI()"
        >
          AI 자동 분류
        </button>

      </div>

    </div>


    <!-- CATEGORY / TOOLS -->

    <nav id="nav" class="nav">

      <button
        class="active"
        data-mode="all"
        onclick="setMode('all')"
      >
        전체
      </button>

      <button
        class="tool"
        data-mode="random"
        onclick="setMode('random')"
      >
        랜덤 탐색
      </button>

      <span id="categoryButtons"></span>

    </nav>

  </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="main">

  <!-- NORMAL VIEW -->

  <section id="normalView">

    <div class="toolbar">

      <div>

        <span id="heading" class="heading">
          전체
        </span>

        <span id="count" class="count">
          0개
        </span>

      </div>

      <input
        id="search"
        class="search"
        placeholder="검색..."
        oninput="render()"
      >

    </div>


    <div
      id="list"
      class="list"
    ></div>

  </section>


  <!-- RANDOM VIEW -->

  <section
    id="randomView"
    class="random-screen"
  >

    <div class="random-card">

      <div class="random-inner">

        <div
          id="randomNumber"
          class="random-number"
        >
          -
        </div>

        <img
          id="randomFavicon"
          class="random-favicon"
          alt=""
        >

        <a
          id="randomTitle"
          class="random-title"
          href="#"
          target="_blank"
          rel="noopener"
        >
          -
        </a>

        <div
          id="randomDomain"
          class="random-domain"
        >
          -
        </div>

        <div
          id="randomCategory"
          class="random-category"
        >
          -
        </div>

        <button
          class="random-next"
          onclick="nextRandom()"
        >
          다음 랜덤 →
        </button>

      </div>

    </div>

  </section>

</main>


<!-- =========================
     HIDDEN FILE INPUTS
========================= -->

<input
  id="htmlFile"
  type="file"
  accept=".html,text/html"
  style="display:none"
  onchange="importBookmarkHTML(event)"
>

<input
  id="jsonFile"
  type="file"
  accept=".json,application/json"
  style="display:none"
  onchange="importJSONFile(event)"
>


<!-- =========================
     EDIT MODAL
========================= -->

<div
  id="editOverlay"
  class="overlay"
>

  <div class="modal">

    <div class="modal-head">

      <div
        id="editTitle"
        class="modal-title"
      >
        북마크 수정
      </div>

      <button
        class="close"
        onclick="closeModal('editOverlay')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="field">

        <label class="label">
          제목
        </label>

        <input
          id="editBookmarkTitle"
        >

      </div>


      <div class="field">

        <label class="label">
          URL
        </label>

        <input
          id="editBookmarkURL"
        >

      </div>


      <div class="field">

        <label class="label">
          대분류
        </label>

        <input
          id="editMainCategory"
          placeholder="예: 디자인"
        >

      </div>


      <div class="field">

        <label class="label">
          소분류
        </label>

        <input
          id="editSubCategory"
          placeholder="예: 레퍼런스"
        >

      </div>

    </div>


    <div class="modal-foot">

      <button
        class="action danger"
        onclick="deleteBookmark()"
      >
        삭제
      </button>

      <div class="modal-right">

        <button
          class="action"
          onclick="closeModal('editOverlay')"
        >
          취소
        </button>

        <button
          class="action dark"
          onclick="saveBookmarkEdit()"
        >
          저장
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     HTML IMPORT INFO
========================= -->

<div
  id="htmlOverlay"
  class="overlay"
>

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        크롬 북마크 가져오기
      </div>

      <button
        class="close"
        onclick="closeModal('htmlOverlay')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div style="font-size:13px;line-height:1.7;color:#555;">

        크롬에서 내보낸
        <strong>bookmarks.html</strong>
        파일을 그대로 넣으면 됩니다.

        <br><br>

        기존 북마크가 있다면
        <strong>기존 데이터 뒤에 추가</strong>됩니다.

      </div>

    </div>


    <div class="modal-foot">

      <button
        class="action"
        onclick="closeModal('htmlOverlay')"
      >
        취소
      </button>

      <button
        class="action dark"
        onclick="chooseHTMLFile()"
      >
        HTML 파일 선택
      </button>

    </div>

  </div>

</div>


<!-- =========================
     JSON MODAL
========================= -->

<div
  id="jsonOverlay"
  class="overlay"
>

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        JSON
      </div>

      <button
        class="close"
        onclick="closeModal('jsonOverlay')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="field">

        <label class="label">
          JSON 데이터
        </label>

        <textarea
          id="jsonText"
          placeholder='북마크 JSON을 넣거나 현재 데이터를 확인할 수 있습니다.'
        ></textarea>

      </div>

    </div>


    <div class="modal-foot">

      <div>

        <button
          class="action"
          onclick="chooseJSONFile()"
        >
          JSON 가져오기
        </button>

        <button
          class="action"
          onclick="exportJSON()"
        >
          JSON 내보내기
        </button>

      </div>

      <button
        class="action dark"
        onclick="applyJSON()"
      >
        JSON 적용
      </button>

    </div>

  </div>

</div>


<!-- =========================
     AI MODAL
========================= -->

<div
  id="aiOverlay"
  class="overlay"
>

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        AI 자동 분류
      </div>

      <button
        class="close"
        onclick="closeModal('aiOverlay')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="field">

        <label class="label">
          Gemini API Key
        </label>

        <input
          id="apiKey"
          type="password"
          placeholder="AIza..."
        >

        <div class="help">
          이 브라우저의 localStorage에 저장됩니다.
        </div>

      </div>


      <div
        style="
          font-size:12px;
          color:#666;
          line-height:1.7;
        "
      >

        현재 보관된 북마크를 AI가 보고
        <strong>대분류 + 소분류</strong>를 자동으로 지정합니다.

        <br>

        제목과 URL은 그대로 유지합니다.

      </div>


      <div
        id="progress"
        class="progress"
      >

        <div
          id="progressText"
          class="progress-text"
        >
          준비 중...
        </div>

        <div class="progress-bar">

          <div
            id="progressFill"
            class="progress-fill"
          ></div>

        </div>

      </div>


      <div
        id="error"
        class="error"
      ></div>

    </div>


    <div class="modal-foot">

      <button
        class="action"
        onclick="closeModal('aiOverlay')"
      >
        취소
      </button>

      <button
        id="aiButton"
        class="action dark"
        onclick="runAI()"
      >
        자동 분류 시작
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

const DATA_KEY = "digitalArchiveData";
const API_KEY = "digitalArchiveGeminiKey";

let archive = [];
let mode = "all";
let currentEditIndex = -1;
let randomIndex = -1;


/* =====================================================
   INIT
===================================================== */

document.addEventListener("DOMContentLoaded", () => {

  const saved =
    localStorage.getItem(DATA_KEY);

  if (saved) {

    try {

      archive = JSON.parse(saved);

      if (!Array.isArray(archive)) {
        archive = [];
      }

    } catch {

      archive = [];

    }

  }


  const key =
    localStorage.getItem(API_KEY);

  if (key) {

    document.getElementById("apiKey").value =
      key;

  }


  render();

});


/* =====================================================
   SAVE
===================================================== */

function saveData() {

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify(archive)
  );

}


/* =====================================================
   MODE
===================================================== */

function setMode(newMode) {

  mode = newMode;


  document
    .querySelectorAll(".nav button")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  const target =
    document.querySelector(
      `.nav button[data-mode="${newMode}"]`
    );


  if (target) {
    target.classList.add("active");
  }


  if (newMode === "random") {

    document
      .getElementById("normalView")
      .style.display = "none";

    document
      .getElementById("randomView")
      .classList.add("show");

    showRandom();

  } else {

    document
      .getElementById("normalView")
      .style.display = "block";

    document
      .getElementById("randomView")
      .classList.remove("show");

    render();

  }

}


/* =====================================================
   CATEGORIES
===================================================== */

function renderCategories() {

  const box =
    document.getElementById("categoryButtons");


  const categories = [
    ...new Set(
      archive
        .map(x => x.mainCategory)
        .filter(Boolean)
    )
  ].sort((a,b) =>
    a.localeCompare(b, "ko")
  );


  box.innerHTML =
    categories.map(category => {

      const active =
        mode === "category:" + category
          ? "active"
          : "";


      return `

        <button
          class="${active}"
          onclick='setCategory(${JSON.stringify(category)})'
        >
          ${escapeHTML(category)}
        </button>

      `;

    }).join("");

}


/* =====================================================
   CATEGORY SELECT
===================================================== */

function setCategory(category) {

  mode =
    "category:" + category;


  document
    .querySelectorAll(".nav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  document
    .getElementById("normalView")
    .style.display = "block";


  document
    .getElementById("randomView")
    .classList.remove("show");


  render();

}


/* =====================================================
   RENDER
===================================================== */

function render() {

  renderCategories();


  const list =
    document.getElementById("list");


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let filtered =
    archive.map((item, index) => ({
      ...item,
      _index: index
    }));


  if (mode.startsWith("category:")) {

    const category =
      mode.substring(9);

    filtered =
      filtered.filter(
        item =>
          (item.mainCategory || "미분류")
          === category
      );

  }


  if (search) {

    filtered =
      filtered.filter(item => {

        const text = [

          item.title,
          item.url,
          item.mainCategory,
          item.subCategory

        ]
          .join(" ")
          .toLowerCase();


        return text.includes(search);

      });

  }


  let title = "전체";


  if (mode.startsWith("category:")) {

    title =
      mode.substring(9);

  }


  document
    .getElementById("heading")
    .textContent = title;


  document
    .getElementById("count")
    .textContent =
      `${filtered.length}개`;


  if (filtered.length === 0) {

    list.innerHTML = `

      <div class="empty">

        <strong>
          ${
            archive.length === 0
              ? "아직 북마크가 없음"
              : "찾는 북마크가 없음"
          }
        </strong>

        ${
          archive.length === 0
            ? "위쪽의 「북마크 HTML」에서 bookmarks.html을 넣어주세요."
            : "검색어나 카테고리를 바꿔보세요."
        }

      </div>

    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(createItem)
      .join("");

}


/* =====================================================
   ITEM
===================================================== */

function createItem(item) {

  const title =
    escapeHTML(
      item.title || "제목 없음"
    );


  const url =
    escapeHTML(
      item.url || "#"
    );


  const domain =
    escapeHTML(
      getDomain(item.url)
    );


  const category =
    escapeHTML(
      item.mainCategory || "미분류"
    );


  const sub =
    escapeHTML(
      item.subCategory || ""
    );


  const favicon =
    getFavicon(item.url);


  return `

    <div class="item">

      ${
        favicon
          ? `
            <img
              class="favicon"
              src="${favicon}"
              alt=""
              onerror="this.style.visibility='hidden'"
            >
          `
          : `
            <div></div>
          `
      }


      <div class="item-main">

        <a
          class="item-title"
          href="${url}"
          target="_blank"
          rel="noopener"
        >
          ${title}
        </a>

        <div class="item-url">
          ${domain}
        </div>

      </div>


      <div class="tag">

        ${category}

        ${
          sub
            ? " / " + sub
            : ""
        }

      </div>


      <button
        class="edit-btn"
        onclick="openEdit(${item._index})"
      >
        수정
      </button>

    </div>

  `;

}


/* =====================================================
   EDIT
===================================================== */

function openEdit(index) {

  currentEditIndex = index;

  const item =
    archive[index];


  document.getElementById(
    "editBookmarkTitle"
  ).value =
    item.title || "";


  document.getElementById(
    "editBookmarkURL"
  ).value =
    item.url || "";


  document.getElementById(
    "editMainCategory"
  ).value =
    item.mainCategory || "";


  document.getElementById(
    "editSubCategory"
  ).value =
    item.subCategory || "";


  document
    .getElementById("editOverlay")
    .classList.add("show");

}


function saveBookmarkEdit() {

  if (
    currentEditIndex < 0 ||
    !archive[currentEditIndex]
  ) {
    return;
  }


  archive[currentEditIndex] = {

    title:
      document.getElementById(
        "editBookmarkTitle"
      ).value.trim(),

    url:
      document.getElementById(
        "editBookmarkURL"
      ).value.trim(),

    mainCategory:
      document.getElementById(
        "editMainCategory"
      ).value.trim(),

    subCategory:
      document.getElementById(
        "editSubCategory"
      ).value.trim()

  };


  saveData();

  closeModal("editOverlay");

  render();

}


function deleteBookmark() {

  if (
    currentEditIndex < 0 ||
    !archive[currentEditIndex]
  ) {
    return;
  }


  if (
    !confirm(
      "이 북마크를 삭제할까요?"
    )
  ) {
    return;
  }


  archive.splice(
    currentEditIndex,
    1
  );


  saveData();

  closeModal("editOverlay");

  render();

}


/* =====================================================
   RANDOM
===================================================== */

function showRandom() {

  if (archive.length === 0) {

    document.getElementById(
      "randomNumber"
    ).textContent = "-";


    document.getElementById(
      "randomTitle"
    ).textContent =
      "북마크가 없습니다.";


    document.getElementById(
      "randomTitle"
    ).removeAttribute("href");


    document.getElementById(
      "randomDomain"
    ).textContent =
      "먼저 북마크를 가져와주세요.";


    return;

  }


  randomIndex =
    Math.floor(
      Math.random() *
      archive.length
    );


  const item =
    archive[randomIndex];


  document.getElementById(
    "randomNumber"
  ).textContent =
    `${randomIndex + 1} / ${archive.length}`;


  document.getElementById(
    "randomTitle"
  ).textContent =
    item.title || "제목 없음";


  document.getElementById(
    "randomTitle"
  ).href =
    item.url || "#";


  document.getElementById(
    "randomDomain"
  ).textContent =
    getDomain(item.url);


  document.getElementById(
    "randomCategory"
  ).textContent =
    [
      item.mainCategory,
      item.subCategory
    ]
      .filter(Boolean)
      .join(" / ") ||
      "미분류";


  const favicon =
    getFavicon(item.url);


  document.getElementById(
    "randomFavicon"
  ).src =
    favicon || "";

}


function nextRandom() {

  if (archive.length === 0) {
    return;
  }


  let next =
    Math.floor(
      Math.random() *
      archive.length
    );


  if (
    archive.length > 1 &&
    next === randomIndex
  ) {

    next =
      (next + 1) %
      archive.length;

  }


  randomIndex = next;

  const item =
    archive[randomIndex];


  document.getElementById(
    "randomNumber"
  ).textContent =
    `${randomIndex + 1} / ${archive.length}`;


  document.getElementById(
    "randomTitle"
  ).textContent =
    item.title || "제목 없음";


  document.getElementById(
    "randomTitle"
  ).href =
    item.url || "#";


  document.getElementById(
    "randomDomain"
  ).textContent =
    getDomain(item.url);


  document.getElementById(
    "randomCategory"
  ).textContent =
    [
      item.mainCategory,
      item.subCategory
    ]
      .filter(Boolean)
      .join(" / ") ||
      "미분류";


  document.getElementById(
    "randomFavicon"
  ).src =
    getFavicon(item.url) || "";

}


/* =====================================================
   HTML BOOKMARK IMPORT
===================================================== */

function openHTMLImport() {

  document
    .getElementById("htmlOverlay")
    .classList.add("show");

}


function chooseHTMLFile() {

  closeModal("htmlOverlay");

  document
    .getElementById("htmlFile")
    .click();

}


function importBookmarkHTML(event) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    try {

      const parser =
        new DOMParser();


      const doc =
        parser.parseFromString(
          e.target.result,
          "text/html"
        );


      const links =
        [...doc.querySelectorAll("a[href]")];


      const imported =
        links.map(a => {

          return {

            title:
              a.textContent.trim() ||
              "제목 없음",

            url:
              a.getAttribute("href") ||
              "",

            mainCategory:
              "",

            subCategory:
              ""

          };

        })
        .filter(x => x.url);


      if (imported.length === 0) {

        alert(
          "북마크를 찾지 못했습니다."
        );

        return;

      }


      archive =
        archive.concat(imported);


      saveData();

      mode = "all";

      render();


      alert(
        `${imported.length}개의 북마크를 가져왔습니다.`
      );


    } catch (error) {

      alert(
        "HTML을 읽는 중 오류가 발생했습니다.\n\n" +
        error.message
      );

    }

  };


  reader.readAsText(file);


  event.target.value = "";

}


/* =====================================================
   JSON
===================================================== */

function openJSON() {

  document.getElementById(
    "jsonText"
  ).value =
    JSON.stringify(
      archive,
      null,
      2
    );


  document
    .getElementById("jsonOverlay")
    .classList.add("show");

}


function chooseJSONFile() {

  document
    .getElementById("jsonFile")
    .click();

}


function importJSONFile(event) {

  const file =
    event.target.files[0];


  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e) {

    document.getElementById(
      "jsonText"
    ).value =
      e.target.result;

  };


  reader.readAsText(file);

  event.target.value = "";

}


function applyJSON() {

  const text =
    document
      .getElementById("jsonText")
      .value
      .trim();


  if (!text) {

    alert(
      "JSON 데이터가 없습니다."
    );

    return;

  }


  try {

    const data =
      JSON.parse(text);


    if (!Array.isArray(data)) {

      throw new Error(
        "JSON은 배열이어야 합니다."
      );

    }


    archive =
      data.map(item => ({

        title:
          item.title || "",

        url:
          item.url || "",

        mainCategory:
          item.mainCategory || "",

        subCategory:
          item.subCategory || ""

      }));


    saveData();

    closeModal("jsonOverlay");

    mode = "all";

    render();


  } catch (error) {

    alert(
      "JSON 형식이 올바르지 않습니다.\n\n" +
      error.message
    );

  }

}


function exportJSON() {

  const blob =
    new Blob(
      [
        JSON.stringify(
          archive,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "digital-archive.json";

  a.click();


  URL.revokeObjectURL(url);

}


/* =====================================================
   AI
===================================================== */

function openAI() {

  clearError();

  document
    .getElementById("aiOverlay")
    .classList.add("show");

}


async function runAI() {

  clearError();


  if (archive.length === 0) {

    showError(
      "먼저 북마크를 가져와주세요."
    );

    return;

  }


  const key =
    document
      .getElementById("apiKey")
      .value
      .trim();


  if (!key) {

    showError(
      "Gemini API Key를 입력해주세요."
    );

    return;

  }


  localStorage.setItem(
    API_KEY,
    key
  );


  const button =
    document.getElementById(
      "aiButton"
    );


  button.disabled = true;

  button.textContent =
    "분류 중...";


  document
    .getElementById("progress")
    .classList.add("show");


  try {

    const chunkSize = 20;

    const result = [];


    for (
      let start = 0;
      start < archive.length;
      start += chunkSize
    ) {

      const chunk =
        archive.slice(
          start,
          start + chunkSize
        );


      const end =
        Math.min(
          start + chunkSize,
          archive.length
        );


      document.getElementById(
        "progressText"
      ).textContent =
        `AI 분류 중... ${end} / ${archive.length}`;


      document.getElementById(
        "progressFill"
      ).style.width =
        `${(end / archive.length) * 100}%`;


      const prompt = `

너는 개인 디지털 북마크를 정리하는 AI다.

각 북마크를 실제 내용과 URL을 보고
사용자가 나중에 찾기 쉽도록 분류해라.

반드시 아래 JSON 배열 형식으로만 답한다.

[
  {
    "title": "원래 제목",
    "url": "원래 URL",
    "mainCategory": "대분류",
    "subCategory": "소분류"
  }
]

규칙:

- title은 절대로 바꾸지 않는다.
- url은 절대로 바꾸지 않는다.
- mainCategory와 subCategory만 새로 지정한다.
- 대분류는 너무 많이 만들지 않는다.
- 비슷한 자료는 같은 대분류로 묶는다.
- 소분류는 필요할 때만 구체적으로 나눈다.
- 한국어 카테고리명을 사용한다.
- 설명문을 넣지 않는다.
- 마크다운을 사용하지 않는다.
- JSON 배열만 반환한다.

북마크:

${JSON.stringify(chunk, null, 2)}

`;


      const response =
        await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "x-goog-api-key":
                key

            },

            body:
              JSON.stringify({

                contents: [

                  {

                    parts: [

                      {
                        text: prompt
                      }

                    ]

                  }

                ],

                generationConfig: {

                  responseMimeType:
                    "application/json"

                }

              })

          }
        );


      if (!response.ok) {

        let message =
          `API 오류 (${response.status})`;


        try {

          const data =
            await response.json();


          if (
            data?.error?.message
          ) {

            message +=
              `\n${data.error.message}`;

          }

        } catch {}


        throw new Error(message);

      }


      const data =
        await response.json();


      const text =
        data
          ?.candidates?.[0]
          ?.content
          ?.parts?.[0]
          ?.text;


      if (!text) {

        throw new Error(
          "Gemini가 결과를 반환하지 않았습니다."
        );

      }


      const parsed =
        JSON.parse(text);


      if (!Array.isArray(parsed)) {

        throw new Error(
          "Gemini 결과가 배열이 아닙니다."
        );

      }


      result.push(
        ...parsed
      );

    }


    archive =
      result.map(item => ({

        title:
          item.title || "",

        url:
          item.url || "",

        mainCategory:
          item.mainCategory ||
          "미분류",

        subCategory:
          item.subCategory ||
          ""

      }));


    saveData();

    render();


    document.getElementById(
      "progressText"
    ).textContent =
      `완료 · ${archive.length}개 분류`;


    setTimeout(() => {

      closeModal("aiOverlay");

    }, 700);


  } catch (error) {

    console.error(error);

    showError(
      error.message ||
      "AI 분류 중 오류가 발생했습니다."
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "자동 분류 시작";

  }

}


/* =====================================================
   HELPERS
===================================================== */

function closeModal(id) {

  document
    .getElementById(id)
    .classList.remove("show");

}


function showError(message) {

  const box =
    document.getElementById(
      "error"
    );


  box.textContent =
    message;


  box.classList.add("show");

}


function clearError() {

  const box =
    document.getElementById(
      "error"
    );


  box.textContent =
    "";


  box.classList.remove("show");

}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getDomain(url) {

  try {

    return new URL(url)
      .hostname
      .replace(/^www\./, "");

  } catch {

    return "";

  }

}


function getFavicon(url) {

  try {

    const domain =
      new URL(url).hostname;


    return (
      "https://www.google.com/s2/favicons" +
      "?domain=" +
      encodeURIComponent(domain) +
      "&sz=32"
    );

  } catch {

    return "";

  }

}


/* =====================================================
   CLOSE MODALS WHEN CLICK OUTSIDE
===================================================== */

document
  .querySelectorAll(".overlay")
  .forEach(overlay => {

    overlay.addEventListener(
      "click",
      function(e) {

        if (e.target === overlay) {

          overlay.classList.remove(
            "show"
          );

        }

      }
    );

  });


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  e => {

    if (e.key === "Escape") {

      document
        .querySelectorAll(".overlay.show")
        .forEach(x =>
          x.classList.remove("show")
        );

    }

  }
);

</script>
