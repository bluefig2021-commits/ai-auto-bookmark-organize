<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Archive</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Noto Sans KR",
    sans-serif;
  background: #f7f7f5;
  color: #222;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  min-height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
  width: 240px;
  min-height: 100vh;
  background: #fff;
  border-right: 1px solid #e5e5e5;
  padding: 24px 16px;
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
}

.logo {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
  padding: 0 10px;
  margin-bottom: 28px;
}

.logo span {
  color: #999;
  font-weight: 400;
}

.category-title {
  font-size: 11px;
  color: #999;
  font-weight: 600;
  padding: 0 10px;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.category-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.category-btn {
  border: 0;
  background: transparent;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border-radius: 7px;
  color: #555;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
}

.category-btn:hover {
  background: #f3f3f2;
}

.category-btn.active {
  background: #eeeeec;
  color: #111;
  font-weight: 600;
}

.category-count {
  color: #aaa;
  font-size: 11px;
}

/* =========================
   MAIN
========================= */

.main {
  margin-left: 240px;
  width: calc(100% - 240px);
  min-height: 100vh;
}

.header {
  height: 70px;
  background: rgba(247,247,245,.9);
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-title {
  font-size: 15px;
  font-weight: 600;
}

.header-count {
  font-size: 12px;
  color: #999;
}

.header-actions {
  display: flex;
  gap: 8px;
}

.btn {
  border: 1px solid #ddd;
  background: #fff;
  color: #333;
  border-radius: 7px;
  padding: 8px 13px;
  font-size: 12px;
}

.btn:hover {
  background: #f1f1ef;
}

.btn.primary {
  background: #222;
  color: #fff;
  border-color: #222;
}

.btn.primary:hover {
  background: #000;
}

.content {
  padding: 34px 36px 60px;
  max-width: 1100px;
}

/* =========================
   SEARCH
========================= */

.search-box {
  margin-bottom: 26px;
}

.search {
  width: 100%;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 8px;
  padding: 12px 14px;
  outline: none;
  font-size: 13px;
}

.search:focus {
  border-color: #aaa;
}

/* =========================
   CATEGORY HEADER
========================= */

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.section-count {
  font-size: 12px;
  color: #999;
}

/* =========================
   BOOKMARK
========================= */

.bookmark-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.bookmark {
  background: #fff;
  border: 1px solid #e7e7e5;
  border-radius: 9px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 13px;
  transition: .15s;
}

.bookmark:hover {
  border-color: #ccc;
  transform: translateY(-1px);
}

.favicon {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  flex-shrink: 0;
  background: #f3f3f3;
}

.bookmark-info {
  min-width: 0;
  flex: 1;
}

.bookmark-title {
  display: block;
  color: #222;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 5px;
}

.bookmark-title:hover {
  text-decoration: underline;
}

.bookmark-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #999;
}

.domain {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  max-width: 250px;
}

.subcategory {
  padding: 3px 7px;
  border-radius: 5px;
  background: #f2f2f0;
  color: #777;
}

/* =========================
   EMPTY
========================= */

.empty {
  border: 1px dashed #d8d8d6;
  background: rgba(255,255,255,.5);
  border-radius: 10px;
  padding: 60px 20px;
  text-align: center;
  color: #999;
  font-size: 13px;
}

.empty strong {
  display: block;
  color: #555;
  margin-bottom: 7px;
}

/* =========================
   MODAL
========================= */

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-bg.show {
  display: flex;
}

.modal {
  width: 100%;
  max-width: 600px;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
  overflow: hidden;
}

.modal-head {
  padding: 20px 22px;
  border-bottom: 1px solid #eee;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 15px;
  font-weight: 700;
}

.close {
  border: 0;
  background: transparent;
  color: #999;
  font-size: 20px;
}

.modal-body {
  padding: 22px;
}

.field {
  margin-bottom: 18px;
}

.field:last-child {
  margin-bottom: 0;
}

.field-label {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 7px;
  color: #555;
}

.field input,
.field textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 7px;
  padding: 10px 12px;
  outline: none;
  background: #fafafa;
}

.field input:focus,
.field textarea:focus {
  background: #fff;
  border-color: #aaa;
}

.field textarea {
  min-height: 220px;
  resize: vertical;
  font-family: monospace;
  font-size: 12px;
}

.help {
  font-size: 11px;
  color: #999;
  line-height: 1.5;
  margin-top: 6px;
}

.modal-foot {
  padding: 15px 22px;
  border-top: 1px solid #eee;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* =========================
   PROGRESS
========================= */

.progress-wrap {
  display: none;
  margin-top: 18px;
}

.progress-wrap.show {
  display: block;
}

.progress-text {
  font-size: 12px;
  color: #777;
  margin-bottom: 7px;
}

.progress-bar {
  height: 5px;
  background: #eee;
  border-radius: 5px;
  overflow: hidden;
}

.progress-inner {
  height: 100%;
  width: 0%;
  background: #222;
  transition: width .2s;
}

/* =========================
   ERROR
========================= */

.error {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 7px;
  background: #fff1f1;
  border: 1px solid #f0d0d0;
  color: #b33;
  font-size: 12px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.error.show {
  display: block;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .sidebar {
    position: static;
    width: 100%;
    min-height: auto;
    border-right: 0;
    border-bottom: 1px solid #e5e5e5;
    padding: 15px;
  }

  .logo {
    margin-bottom: 14px;
  }

  .category-list {
    flex-direction: row;
    overflow-x: auto;
  }

  .category-btn {
    width: auto;
    white-space: nowrap;
  }

  .app {
    display: block;
  }

  .main {
    margin-left: 0;
    width: 100%;
  }

  .header {
    padding: 0 15px;
  }

  .content {
    padding: 20px 15px 40px;
  }

  .bookmark {
    padding: 12px;
  }

  .domain {
    max-width: 150px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      Digital Archive <span>/ 개인 보관함</span>
    </div>

    <div class="category-title">
      CATEGORY
    </div>

    <div id="categoryList" class="category-list"></div>

  </aside>


  <!-- MAIN -->
  <main class="main">

    <header class="header">

      <div class="header-left">
        <div id="headerTitle" class="header-title">
          전체 북마크
        </div>

        <div id="headerCount" class="header-count">
          0개
        </div>
      </div>

      <div class="header-actions">

        <button class="btn" onclick="openModal()">
          가져오기
        </button>

        <button class="btn primary" onclick="openModal()">
          AI 분류
        </button>

      </div>

    </header>


    <section class="content">

      <div class="search-box">
        <input
          id="searchInput"
          class="search"
          type="text"
          placeholder="북마크 검색..."
          oninput="renderBookmarks()"
        >
      </div>


      <div class="section-header">

        <div id="sectionName" class="section-name">
          전체
        </div>

        <div id="sectionCount" class="section-count">
          0개
        </div>

      </div>


      <div id="bookmarkContainer" class="bookmark-list"></div>

    </section>

  </main>

</div>


<!-- MODAL -->

<div id="modalBg" class="modal-bg">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        북마크 가져오기
      </div>

      <button class="close" onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="field">

        <div class="field-label">
          Gemini API Key
        </div>

        <input
          id="apiKeyInput"
          type="password"
          placeholder="AIza..."
        >

        <div class="help">
          API 키는 이 브라우저의 localStorage에 저장됩니다.
        </div>

      </div>


      <div class="field">

        <div class="field-label">
          JSON 파일
        </div>

        <input
          id="fileInput"
          type="file"
          accept=".json,application/json"
          onchange="loadJSONFile(event)"
        >

      </div>


      <div class="field">

        <div class="field-label">
          또는 JSON 직접 붙여넣기
        </div>

        <textarea
          id="jsonInput"
          placeholder='[{"title":"예시","url":"https://example.com"}]'
        ></textarea>

      </div>


      <div id="progressWrap" class="progress-wrap">

        <div id="progressText" class="progress-text">
          준비 중...
        </div>

        <div class="progress-bar">
          <div id="progressInner" class="progress-inner"></div>
        </div>

      </div>


      <div id="errorBox" class="error"></div>

    </div>


    <div class="modal-foot">

      <button class="btn" onclick="closeModal()">
        취소
      </button>

      <button
        id="classifyButton"
        class="btn primary"
        onclick="classifyBookmarks()"
      >
        AI로 분류하기
      </button>

    </div>

  </div>

</div>


<script>

/* ==========================================
   DATA
========================================== */

const DATA_KEY = "digitalArchiveData";
const API_KEY = "digitalArchiveGeminiKey";

let archive = [];
let activeCategory = "__all";


/* ==========================================
   INIT
========================================== */

document.addEventListener("DOMContentLoaded", () => {

  const savedData = localStorage.getItem(DATA_KEY);

  if (savedData) {

    try {
      archive = JSON.parse(savedData);

      if (!Array.isArray(archive)) {
        archive = [];
      }

    } catch (e) {
      archive = [];
    }

  }

  const savedKey = localStorage.getItem(API_KEY);

  if (savedKey) {
    document.getElementById("apiKeyInput").value = savedKey;
  }

  renderAll();

});


/* ==========================================
   SAVE
========================================== */

function saveArchive() {

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify(archive)
  );

}


/* ==========================================
   MODAL
========================================== */

function openModal() {

  document
    .getElementById("modalBg")
    .classList.add("show");

}


function closeModal() {

  document
    .getElementById("modalBg")
    .classList.remove("show");

}


document
  .getElementById("modalBg")
  .addEventListener("click", function(e) {

    if (e.target === this) {
      closeModal();
    }

  });


/* ==========================================
   JSON FILE
========================================== */

function loadJSONFile(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    document
      .getElementById("jsonInput")
      .value = e.target.result;

  };

  reader.readAsText(file);

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ==========================================
   DOMAIN
========================================== */

function getDomain(url) {

  try {

    return new URL(url).hostname
      .replace(/^www\./, "");

  } catch {

    return "";

  }

}


/* ==========================================
   RENDER ALL
========================================== */

function renderAll() {

  renderCategories();
  renderBookmarks();

}


/* ==========================================
   CATEGORIES
========================================== */

function renderCategories() {

  const container =
    document.getElementById("categoryList");

  const categoryCounts = {};

  archive.forEach(item => {

    const category =
      item.mainCategory || "미분류";

    categoryCounts[category] =
      (categoryCounts[category] || 0) + 1;

  });


  const categories =
    Object.keys(categoryCounts)
      .sort((a, b) =>
        a.localeCompare(b, "ko")
      );


  let html = `

    <button
      class="category-btn ${activeCategory === "__all" ? "active" : ""}"
      onclick="selectCategory('__all')"
    >

      <span>전체</span>

      <span class="category-count">
        ${archive.length}
      </span>

    </button>

  `;


  categories.forEach(category => {

    html += `

      <button
        class="category-btn ${activeCategory === category ? "active" : ""}"
        onclick="selectCategory(${JSON.stringify(category)})"
      >

        <span>
          ${escapeHTML(category)}
        </span>

        <span class="category-count">
          ${categoryCounts[category]}
        </span>

      </button>

    `;

  });


  container.innerHTML = html;

}


/* ==========================================
   CATEGORY SELECT
========================================== */

function selectCategory(category) {

  activeCategory = category;

  renderAll();

}


/* ==========================================
   RENDER BOOKMARKS
========================================== */

function renderBookmarks() {

  const container =
    document.getElementById("bookmarkContainer");

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  let filtered = archive.filter(item => {

    if (
      activeCategory !== "__all" &&
      (item.mainCategory || "미분류") !== activeCategory
    ) {
      return false;
    }


    if (!search) {
      return true;
    }


    const text = [

      item.title,
      item.url,
      item.mainCategory,
      item.subCategory

    ]
      .join(" ")
      .toLowerCase();


    return text.includes(search);

  });


  const title =
    activeCategory === "__all"
      ? "전체"
      : activeCategory;


  document.getElementById("sectionName").textContent =
    title;


  document.getElementById("sectionCount").textContent =
    `${filtered.length}개`;


  document.getElementById("headerTitle").textContent =
    title === "전체"
      ? "전체 북마크"
      : title;


  document.getElementById("headerCount").textContent =
    `${archive.length}개`;


  if (filtered.length === 0) {

    container.innerHTML = `

      <div class="empty">

        <strong>
          ${archive.length === 0
            ? "아직 북마크가 없습니다."
            : "검색 결과가 없습니다."}
        </strong>

        ${archive.length === 0
          ? "오른쪽 위 가져오기를 눌러 JSON 북마크를 가져와보세요."
          : "다른 검색어나 카테고리를 선택해보세요."}

      </div>

    `;

    return;

  }


  container.innerHTML =
    filtered
      .map(createBookmarkHTML)
      .join("");

}


/* ==========================================
   BOOKMARK HTML
========================================== */

function createBookmarkHTML(item) {

  const title =
    escapeHTML(item.title || "제목 없음");

  const url =
    escapeHTML(item.url || "#");

  const domain =
    escapeHTML(getDomain(item.url || ""));

  const mainCategory =
    escapeHTML(item.mainCategory || "미분류");

  const subCategory =
    escapeHTML(item.subCategory || "");


  let favicon = "";

  try {

    favicon =
      `https://www.google.com/s2/favicons?domain=${
        encodeURIComponent(
          new URL(item.url).hostname
        )
      }&sz=32`;

  } catch {

    favicon = "";

  }


  return `

    <article class="bookmark">

      ${
        favicon
          ? `<img
              class="favicon"
              src="${favicon}"
              alt=""
              loading="lazy"
              onerror="this.style.visibility='hidden'"
            >`
          : `<div class="favicon"></div>`
      }


      <div class="bookmark-info">

        <a
          class="bookmark-title"
          href="${url}"
          target="_blank"
          rel="noopener noreferrer"
          title="${title}"
        >
          ${title}
        </a>


        <div class="bookmark-meta">

          <span class="domain">
            ${domain}
          </span>

          <span>
            ${mainCategory}
          </span>

          ${
            subCategory
              ? `<span class="subcategory">
                  ${subCategory}
                </span>`
              : ""
          }

        </div>

      </div>

    </article>

  `;

}


/* ==========================================
   ERROR
========================================== */

function showError(message) {

  const box =
    document.getElementById("errorBox");

  box.textContent = message;

  box.classList.add("show");

}


function clearError() {

  const box =
    document.getElementById("errorBox");

  box.textContent = "";

  box.classList.remove("show");

}


/* ==========================================
   PROGRESS
========================================== */

function setProgress(current, total) {

  const wrap =
    document.getElementById("progressWrap");

  const text =
    document.getElementById("progressText");

  const inner =
    document.getElementById("progressInner");


  wrap.classList.add("show");

  const percent =
    Math.round((current / total) * 100);


  inner.style.width =
    `${percent}%`;


  text.textContent =
    `AI 분류 중... ${current} / ${total}`;

}


/* ==========================================
   AI CLASSIFY
========================================== */

async function classifyBookmarks() {

  clearError();


  const key =
    document
      .getElementById("apiKeyInput")
      .value
      .trim();


  const jsonText =
    document
      .getElementById("jsonInput")
      .value
      .trim();


  if (!key) {

    showError(
      "Gemini API Key를 입력해주세요."
    );

    return;

  }


  if (!jsonText) {

    showError(
      "북마크 JSON을 넣어주세요."
    );

    return;

  }


  let bookmarks;


  try {

    bookmarks =
      JSON.parse(jsonText);

  } catch (e) {

    showError(
      "JSON 형식이 올바르지 않습니다.\n\n" +
      e.message
    );

    return;

  }


  if (!Array.isArray(bookmarks)) {

    showError(
      "JSON의 최상위 구조가 배열이어야 합니다."
    );

    return;

  }


  if (bookmarks.length === 0) {

    showError(
      "북마크가 비어 있습니다."
    );

    return;

  }


  /* API KEY 저장 */

  localStorage.setItem(
    API_KEY,
    key
  );


  const button =
    document.getElementById("classifyButton");

  button.disabled = true;
  button.textContent = "분류 중...";


  try {

    const chunkSize = 20;

    const chunks = [];


    for (
      let i = 0;
      i < bookmarks.length;
      i += chunkSize
    ) {

      chunks.push(
        bookmarks.slice(i, i + chunkSize)
      );

    }


    let results = [];


    for (
      let i = 0;
      i < chunks.length;
      i++
    ) {

      setProgress(
        Math.min(
          (i + 1) * chunkSize,
          bookmarks.length
        ),
        bookmarks.length
      );


      const chunk =
        chunks[i];


      const prompt = `

너는 사용자의 개인 북마크를 정리하는 분류 AI다.

아래 북마크들을 내용과 URL을 보고 적절한 카테고리로 분류해라.

각 북마크마다 다음 형식으로 반환한다.

[
  {
    "title": "원래 제목",
    "url": "원래 URL",
    "mainCategory": "대분류",
    "subCategory": "소분류"
  }
]

규칙:

1. title과 url은 원본을 그대로 유지한다.
2. mainCategory는 너무 세분화하지 말고 비슷한 북마크끼리 묶는다.
3. subCategory는 mainCategory 안에서 내용을 더 구체적으로 구분한다.
4. 사용자가 나중에 찾기 쉽도록 실용적으로 분류한다.
5. 카테고리 이름은 한국어로 작성한다.
6. 설명이나 마크다운은 절대 넣지 않는다.
7. 반드시 JSON 배열만 반환한다.

북마크:

${JSON.stringify(chunk, null, 2)}

`;


      /*
       * 중요:
       * 기존 gemini-2.5-flash-lite 대신
       * 현재 신규 사용자가 사용할 수 있는
       * gemini-3.5-flash-lite 사용
       */

      const endpoint =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent";


      const response =
        await fetch(endpoint, {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              key

          },

          body: JSON.stringify({

            contents: [

              {

                parts: [

                  {
                    text: prompt
                  }

                ]

              }

            ],

            generationConfig: {

              responseMimeType:
                "application/json"

            }

          })

        });


      if (!response.ok) {

        let errorMessage =
          `API 오류 (${response.status})`;


        try {

          const errorData =
            await response.json();

          if (
            errorData &&
            errorData.error &&
            errorData.error.message
          ) {

            errorMessage +=
              `\n${errorData.error.message}`;

          }

        } catch {

          const text =
            await response.text();

          if (text) {
            errorMessage +=
              `\n${text}`;
          }

        }


        throw new Error(
          errorMessage
        );

      }


      const data =
        await response.json();


      const text =
        data
          ?.candidates?.[0]
          ?.content
          ?.parts?.[0]
          ?.text;


      if (!text) {

        throw new Error(
          "Gemini가 분류 결과를 반환하지 않았습니다."
        );

      }


      let parsed;


      try {

        parsed =
          JSON.parse(text);

      } catch (e) {

        console.log(
          "Gemini raw response:",
          text
        );

        throw new Error(
          "Gemini가 올바른 JSON을 반환하지 않았습니다."
        );

      }


      if (!Array.isArray(parsed)) {

        throw new Error(
          "Gemini 응답이 배열 형태가 아닙니다."
        );

      }


      results =
        results.concat(
          parsed.map(item => ({

            title:
              item.title || "",

            url:
              item.url || "",

            mainCategory:
              item.mainCategory ||
              "미분류",

            subCategory:
              item.subCategory ||
              ""

          }))
        );

    }


    archive = results;


    saveArchive();

    activeCategory = "__all";


    document.getElementById("progressText")
      .textContent =
      `완료! ${results.length}개 분류됨`;


    document.getElementById("progressInner")
      .style.width = "100%";


    renderAll();


    setTimeout(() => {

      closeModal();

    }, 700);


  } catch (error) {

    console.error(error);

    showError(
      error.message ||
      "분류 중 오류가 발생했습니다."
    );


  } finally {

    button.disabled = false;
    button.textContent = "AI로 분류하기";

  }

}

    if (e.key === "Escape") {
      closeModal();
    }

  }
